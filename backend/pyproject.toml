[tool.poetry]
name = "trademind-backend"
version = "0.1.0"
description = "Backend for TradeMind AI"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.101.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
SQLAlchemy = "^2.0.30"
asyncpg = "^0.27.0"
alembic = "^1.12.0"
psycopg[binary] = "*"
pydantic = "^2.5.2"
python-jose = "^3.3.0"
passlib[bcrypt] = "^1.8.2"
redis = "^5.3.0"
celery = "^5.4.0"
httpx = "^0.24.0"
python-dotenv = "^1.1.0"

[tool.poetry.dev-dependencies]
pytest = "^8.4.0"
pytest-asyncio = "^0.21.0"

tool.poetry.scripts = {"worker" = "app.workers.worker:app"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"