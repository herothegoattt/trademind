name: Deploy Frontend → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-azure.yml"
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  # ── Fill these in GitHub → Settings → Secrets and variables → Actions ──────
  # ACR_LOGIN_SERVER             : trademindacr.azurecr.io
  # ACR_USERNAME                 : trademindacr  (or service principal client ID)
  # ACR_PASSWORD                 : <ACR admin password or SP secret>
  # AZURE_WEBAPP_NAME            : trademind-frontend  (App Service name)
  # AZURE_WEBAPP_PUBLISH_PROFILE : <publish profile XML>
  # BACKEND_INTERNAL_URL         : https://<backend-app>.azurewebsites.net
  # ─────────────────────────────────────────────────────────────────────────────

  IMAGE_NAME: trademind-frontend
  NEXT_PUBLIC_API_URL: https://trademindtech.com
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "714971043934-cmrcae4dp165dl713nuejlp1kk19glsr.apps.googleusercontent.com"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_51TN8yQGoDkgCJq9SehhCKVqW7vgUb5rm8i7psqgY26Wuc0ydSABj6SyESBlHSrb4idQZtki846n6hgyPjy3j1Kwh00t1sVSwDX"
  NEXT_PUBLIC_POSTHOG_TOKEN: "phc_qfkbdzyeqgvjhEXNpj6Zlv3V0KbrRF3Cfeb9AAloCUK"
  NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BBzTfqgdvASaYp7DzF2uKkuLs0fX4W_gc5Xid0N5QJ8XW9iGd7-lmlms-Po6Wt-X32vf3lLLr6ci3zWkUzjPnuY"

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Log in to Azure Container Registry
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Build Docker image (bakes all NEXT_PUBLIC_* vars at build time)
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_POSTHOG_TOKEN=${{ env.NEXT_PUBLIC_POSTHOG_TOKEN }} \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST=${{ env.NEXT_PUBLIC_POSTHOG_HOST }} \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ env.NEXT_PUBLIC_VAPID_PUBLIC_KEY }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            ./frontend

      # 4. Push to ACR
      - name: Push to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 5. Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
